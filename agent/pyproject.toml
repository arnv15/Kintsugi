[project]
name = "kintsugi-agent"
version = "0.1.0"
description = "Claude Agent SDK runtime for isolated Kintsugi bug-fixing Runs"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk==0.2.123",
]

[project.scripts]
kintsugi-agent = "kintsugi_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kintsugi_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
